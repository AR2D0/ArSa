{% extends "base.html" %}
{% block title %}Date Mission{% endblock %}

{% block content %}
<div class="mission-container text-center">
    <div class="step-indicator">
        <span class="step-dot active"></span>
        <span class="step-dot"></span>
        <span class="step-dot"></span>
        <span class="step-dot"></span>
        <span class="step-dot"></span>
    </div>

    <div class="glass-card p-4 p-md-5">
        <h1 class="display-6 fw-bold mb-4">
            Would you go on a date with me, Samina?
        </h1>
        <p class="text-muted mb-5">This is a very important question ❤️</p>

        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
            <a href="{% url 'dates:mission_date' %}" class="btn btn-primary-arsa btn-lg px-5">
                Yes 💕
            </a>
            <button type="button" class="btn btn-danger-soft btn-lg px-5" id="no-btn">
                No
            </button>
        </div>
    </div>
</div>

<!-- Modal for No -->
<div class="modal fade" id="noModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-danger">Error</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-0">This feature has been disabled by Arshia.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-arsa" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('no-btn').addEventListener('click', function () {
    var modal = new bootstrap.Modal(document.getElementById('noModal'));
    modal.show();
});
</script>
{% endblock %}
