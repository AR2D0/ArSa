{% extends "base.html" %}
{% block title %}Choose a Location{% endblock %}

{% block content %}
<div class="mission-container">
    <div class="step-indicator">
        <span class="step-dot done"></span>
        <span class="step-dot done"></span>
        <span class="step-dot done"></span>
        <span class="step-dot active"></span>
        <span class="step-dot"></span>
    </div>

    <div class="glass-card p-4 p-md-5 text-center">
        <h1 class="display-6 fw-bold mb-2">Choose a location</h1>
        <p class="text-muted mb-4">Where would you like to go? 📍</p>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-4 text-start">
                <label class="form-label" for="id_location_name">{{ form.location_name.label }}</label>
                {{ form.location_name }}
                {% if form.location_name.errors %}
                <div class="text-danger small mt-1">{{ form.location_name.errors.0 }}</div>
                {% endif %}
            </div>

            <div class="d-flex gap-3 justify-content-center">
                <a href="{% url 'dates:mission_time' %}" class="btn btn-outline-arsa">← Previous</a>
                <button type="submit" class="btn btn-primary-arsa">Next →</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
