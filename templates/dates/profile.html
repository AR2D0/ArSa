{% extends "base.html" %}
{% block title %}Profile{% endblock %}

{% block content %}
<div class="mission-container">
    <div class="glass-card p-4 p-md-5">
        <h2 class="mb-4 text-gradient">Your Profile</h2>

        <div class="row g-3">
            <div class="col-sm-4 text-muted">Username</div>
            <div class="col-sm-8 fw-medium">{{ user.username }}</div>

            <div class="col-sm-4 text-muted">Display Name</div>
            <div class="col-sm-8 fw-medium">{{ user.get_display_name }}</div>

            <div class="col-sm-4 text-muted">Role</div>
            <div class="col-sm-8 fw-medium">{{ user.role|title }}</div>

            <div class="col-sm-4 text-muted">Member Since</div>
            <div class="col-sm-8 fw-medium">{{ user.created_at|date:"F j, Y" }}</div>
        </div>

        <div class="mt-4">
            <a href="{% url 'dates:dashboard' %}" class="btn btn-outline-arsa">← Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
